<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bagian 1 - Dasar A-Frame</title>
    <!-- Library A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>

  <body>
    <!-- Scene utama -->
    <a-scene>
      <!-- Objek dasar -->
      <a-box position="0 0 0" color="tomato"></a-box>

      <a-sphere position="0 0.95 2" radius="1" color="blue"></a-sphere>

      <a-cylinder position="0 0.75 -2" radius="0.5" height="1.5" color="yellow"></a-cylinder>

      <a-plane rotation="-90 0 0" width="10" height="10" color="lightgreen"></a-plane>

      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
